apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: graph-automation-kafka
spec:
  kafka:
    version: 4.3.1
    metadataVersion: "4.3"
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: scram-sha-512
#    authorization:
#      type: simple
    config:
      default.replication.factor: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
  entityOperator:
    topicOperator: { }
    userOperator: { }
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: combined-pool
  labels:
    strimzi.io/cluster: graph-automation-kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        kraftMetadata: shared
        # Set to false if you want your PVC to be kept after removing this node pool
        deleteClaim: true
  jvmOptions:
    -Xms: 1g
    -Xmx: 1g
  resources:
    requests:
      cpu: "500m"
      memory: 1Gi
    limits:
      memory: 2Gi
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: graph-automation-morphkgc-jobs
  labels:
    strimzi.io/cluster: graph-automation-kafka
spec:
  topicName: graph-automation.morphkgc.jobs
  partitions: 8
  replicas: 1
  config:
    retention.ms: 86400000
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: graph-automation-morphkgc-results
  labels:
    strimzi.io/cluster: graph-automation-kafka
spec:
  topicName: graph-automation.morphkgc.results
  partitions: 8
  replicas: 1
  config:
    retention.ms: 86400000
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: graph-automation-morphkgc
  labels:
    strimzi.io/cluster: graph-automation-kafka
spec:
  authentication:
    type: scram-sha-512
