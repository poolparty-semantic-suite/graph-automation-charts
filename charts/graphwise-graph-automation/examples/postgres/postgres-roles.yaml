---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: graph-automation-workflows
spec:
  cluster:
    name: graph-automation-postgres
  name: workflows
  login: true
  superuser: false
  createdb: false
  createrole: false
  inherit: true
  passwordSecret:
    name: graph-automation-postgres-workflows-user
  databaseRoleReclaimPolicy: retain
