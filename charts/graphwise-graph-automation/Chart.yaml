#
# Official Helm chart for deploying Graphiwse Automation services.
#
apiVersion: v2
name: graphwise-graph-automation
description: Umbrella chart for deploying Graphwise Graph Automation services
type: application
version: 0.3.0
kubeVersion: ^1.34.0-0
home: https://graphwise.ai/
icon: https://graphwise.ai/wp-content/uploads/2024/10/cropped-graphwise_favicon-192x192.png
maintainers:
  - name: poolparty-semantic-suite
    email: support@graphwise.ai
    url: https://graphwise.ai
sources:
  - https://github.com/poolparty-semantic-suite/graph-automation-charts
keywords:
  - graphwise
  - graph
  - automation
  - database
  - knowledge
dependencies:
  # Graphwise Workflows 1.0.0
  - name: graphwise-workflows
    version: 0.4.0
    repository: https://poolparty-semantic-suite.github.io/graphwise-workflows-chart
    alias: workflows
    condition: workflows.enabled
  # Morph-KGC Worker 0.2.0
  - name: graphwise-graph-automation-morphkgc-worker
    version: 0.1.0
    repository: file://../graphwise-graph-automation-morphkgc
    alias: morphkgc
    condition: morphkgc.enabled
  # Chunker API
  - name: graphwise-graph-automation-chunker
    version: 0.1.0
    repository: file://../graphwise-graph-automation-chunker
    alias: chunkerAPI
    condition: chunkerAPI.enabled
  # Chunker Store
  - name: graphwise-graph-automation-chunker
    version: 0.1.0
    repository: file://../graphwise-graph-automation-chunker
    alias: chunkerStore
    condition: chunkerStore.enabled
  # Chunker Parse
  - name: graphwise-graph-automation-chunker
    version: 0.1.0
    repository: file://../graphwise-graph-automation-chunker
    alias: chunkerParse
    condition: chunkerParse.enabled
  # Chunker Sectioning
  - name: graphwise-graph-automation-chunker
    version: 0.1.0
    repository: file://../graphwise-graph-automation-chunker
    alias: chunkerSectioning
    condition: chunkerSectioning.enabled
