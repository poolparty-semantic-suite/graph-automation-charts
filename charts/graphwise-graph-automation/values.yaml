###############################################################################
# Main configuration file                                                     #
# To override single property use --set                                       #
# To override multiple, provide another values-override.yaml with the -f flag #
# See https://helm.sh/docs/chart_template_guide/values_files/                 #
###############################################################################

#########################
# Global Configurations #
#########################

global:
  # Overrides image.registry in subcharts.
  # Can be used to override it globally when using umbrella charts.
  imageRegistry: ""

  # Inserts additional pull secret references.
  # Can be used to override it globally when using umbrella charts.
  # Values are processed as Helm templates.
  # Ref: https://kubernetes.io/docs/concepts/configuration/secret/#using-imagepullsecrets
  #
  # Example:
  # imagePullSecrets:
  #   - name: my-pull-secret
  imagePullSecrets: []

######################################
# Graphwise Workflows Configurations #
######################################

# Configuration overrides for the Graphwise Workflows chart.
# Ref: https://github.com/poolparty-semantic-suite/graphwise-workflows-chart
workflows:
  # Toggles the deployment of the GraphRAG Workflows.
  enabled: true

  # Name and name prefix for the Workflows resources.
  fullnameOverride: graph-automation-workflows

  # A commercial license key is required for using enterprise features.
  # Ref: https://docs.n8n.io/hosting/configuration/environment-variables/licenses/#license-environment-variables
  license:
    existingSecret: ""

  # Graphwise Workflows configuration settings.
  configuration:
    # The external URL at which the Workflows should be accessible.
    externalUrl: https://platform.127.0.0.1.nip.io/automation/

    # Uncomment the next section to provide configurations as environment variables.
    # Values are processed as Helm templates.
    # Ref: https://docs.n8n.io/deploy/host-n8n/configure-n8n/basic-configuration/use-environment-variables
    environment:
      # Enables the execute node, needed by the document ingestion workflows
      NODES_EXCLUDE: '[]'

    # Encryption key for Workflows credentials.
    # If not provided, the Workflows will generate a random key.
    # For production, it is highly recommended to provide the key via a Secret resource.
    # Ref: https://docs.n8n.io/deploy/host-n8n/configure-n8n/basic-configuration/use-environment-variables/deployment
    encryption:
      # Reference to a Secret containing a field with the encryption key.
      existingSecret: graph-automation-workflows-encryption
      # Name of the key in the existing Secret that contains the encryption key.
      secretKey: N8N_ENCRYPTION_KEY

    # Configurations for connecting Workflows to a PostgreSQL database.
    # The default values are prepared for a PostgreSQL database created by the CNPG operator, see examples/postgres.
    # Tune these according to your environment if you have your own PostgreSQL cluster.
    # Ref: https://docs.n8n.io/hosting/configuration/environment-variables/database/#postgresql
    postgresdb:
      host: graph-automation-postgres-rw
      port: 5432
      database: workflows
      credentials:
        # Reference to a Secret containing the credentials for connecting to the PostgreSQL database.
        # The value is processed as a Helm template.
        existingSecret: graph-automation-postgres-workflows-user
        # Name of the key in the existing secret that contains the username.
        usernameKey: username
        # Name of the key in the existing secret that contains the password.
        passwordKey: password

  # Ingress configuration for the Workflows service.
  #
  # By default, the Ingress is disabled, and the chart makes no assumptions of what Ingress controller is being used.
  # It's up to you to define if you are going to directly map inbound traffic to the Service or use the Ingress.
  #
  # If you are using the Ingress, make sure to check for any specific annotations required by the controller
  # implementation in your cluster, especially for subpath access.
  #
  # Note that to deploy the Workflows service on a subpath, depending on the Ingress controller, you have
  # to strip out the subpath from the upstream request.
  #
  # See examples/nginx-ingress/ for an example of how to configure the Ingress for the Nginx Ingress Controller.
  # See the sub chart for further details.
  ingress:
    enabled: false
    className: ""
    annotations: {}

  persistence:
    # We use an external database and an external Secret for the encryuptiopn key, thus no need a storage for the Workflows.
    enabled: false

  # Extra volume and volume mount for a persistence layer for sharing BLOBs (files, documents etc.) between
  # the Workflows service and Kafka workers.
  #
  # Important: This volume must support ReadWriteMany access mode so Kubernetes can schedule the services across
  # different nodes and failure domains.
  extraVolumes:
    - name: data-share
      persistentVolumeClaim:
        claimName: graph-automation-nfs

  # The Workflows write BLOBs at /data so make sure to keep this unchanged.
  extraVolumeMounts:
    - name: data-share
      mountPath: /data

  # Resource configurations for the Workflows pods.
  resources:
    limits:
      memory: 1Gi
    requests:
      memory: 1Gi

  # Selector labels to match when selecting nodes.
  nodeSelector: {}

  # Configurations for spreading Pods across different failure domains.
  topologySpreadConstraints: []

  #########################################
  # Workflows Task Runners Configurations #
  #########################################

  # Task runners are a side-car container that runs any tasks triggered by the Code node.
  runners:
    # Defaulting to external task runners.
    external: true

    # Graphwise Workflows task runners configuration settings.
    configuration:
      # Authentication token for the Workflows task runners and the main Workflows instances.
      token:
        # Reference to a Secret containing a field with the authentication token.
        # This is a mandatory secret when the runners are enabled.
        existingSecret: graph-automation-workflows-task-runners-token
        # Name of the key in the existing Secret that contains the authentication token.
        tokenKey: N8N_RUNNERS_AUTH_TOKEN

    persistence:
      # Shared volume for storing data between Workflows instances and the task runners.
      shared:
        enabled: true
        # Configurations for an ephemeral emptyDir volume to be used for shared data storage.
        emptyDir:
          sizeLimit: 1Gi

    # Resource configurations for the Workflows task runners containers.
    resources:
      limits:
        memory: 512Mi
      requests:
        memory: 256Mi
        cpu: 100m

####################################################################
# Graphwise Graph Automation Morph-KGC Kafka worker configurations #
####################################################################

# This service is responsible for materializing RDF knowledge graphs from source data based on mapping files.
morphkgc:
  # Toggles the deployment of the GraphRAG Workflows.
  enabled: true

  # Name and name prefix for the Morph-KGC worker resources.
  nameOverride: morph-kgc
  fullnameOverride: graph-automation-morphkgc

  # Number of Morph-KGC Kafka worker pods to deploy.
  replicas: 1

  # Graph Automation Morph-KGC worker runtime configuration settings.
  configuration:
    # Configuration properties inserted as envrionemnt variables in the container.
    # Values are processed as Helm templates.
    properties:
      KAFKA_JOBS_TOPIC: graph-automation.morphkgc.jobs
      KAFKA_RESULTS_TOPIC: graph-automation.morphkgc.results

    # Configurations for connecting to Kafka.
    # The default values are tuned for the example Kafka instance deployed from the examples/kafka/ resources.
    # Make sure to update them accordingly if you have an existing Kafka cluster.
    kafka:
      servers: graph-automation-kafka-bootstrap:9092
      security:
        protocol: SASL_PLAINTEXT
        sasl:
          mechanism: SCRAM-SHA-512
          credentials:
            existingSecret: graph-automation-morphkgc-kafka-user
            username: graph-automation-morphkgc-kafka-user
            passwordKey: password

  # Existing PeristentVolumeCLaim for a persistence layer for sharing BLOBs (files, documents etc.) between
  # the Workflows service and the Morph-KGC worker.
  #
  # Important: This volume must support ReadWriteMany access mode so Kubernetes can schedule the services across
  # different nodes and failure domains.
  #
  # You can use the example NFS-backed PVC in the examples/nfs/ folder.
  sharedVolume:
    mountPath: /data
    existingVolumeClaim:
      claimName: graph-automation-nfs

  # Resource configurations for the Morph-KFC worker pods.
  resources:
    limits:
      memory: 1Gi
    requests:
      memory: 1Gi

  # Selector labels to match when selecting nodes.
  nodeSelector: {}

  # Configurations for spreading Pods across different failure domains.
  topologySpreadConstraints: []

##################################################################
# Graphwise Graph Automation Document Chunker API configurations #
##################################################################

chunkerAPI:
  # Toggles the deployment of the Graph Automation Chunker API service.
  enabled: true

  # Name and name prefix for the Chunker API service resources.
  nameOverride: chunker-api
  fullnameOverride: graph-automation-chunker-api

  # Number of Chunker API service pods to deploy.
  replicas: 1

  # Graph Automation Chunker API runtime configuration settings.
  configuration:
    # Chunker service mode.
    mode: api
    # Configuration properties inserted as envrionemnt variables in the container.
    # Values are processed as Helm templates.
    properties:
      # Disables the default management control socket
      GUNICORN_CMD_ARGS: "--no-control-socket"

    # Configurations for connecting to Kafka.
    # The default values are tuned for the example Kafka instance deployed from the examples/kafka/ resources.
    # Make sure to update them accordingly if you have an existing Kafka cluster.
    kafka:
      servers: graph-automation-kafka-bootstrap:9092
      security:
        protocol: SASL_PLAINTEXT
        sasl:
          mechanism: SCRAM-SHA-512
          credentials:
            existingSecret: graph-automation-chunker-kafka-user
            username: graph-automation-chunker-kafka-user
            passwordKey: password

    # Configurations for connecting the Chunker service to a PostgreSQL database.
    postgresdb:
      host: graph-automation-postgres-rw
      credentials:
        existingSecret: graph-automation-postgres-chunker-user
        usernameKey: username
        passwordKey: password

  persistence:
    enabled: false

  uploadsVolume:
    existingVolumeClaim:
      claimName: graph-automation-chunker-nfs

  # Resource configurations for the Chunker API pods.
  resources:
    limits:
      memory: 1Gi
    requests:
      memory: 1Gi

  # Selector labels to match when selecting nodes.
  nodeSelector: {}

  # Configurations for spreading Pods across different failure domains.
  topologySpreadConstraints: []

