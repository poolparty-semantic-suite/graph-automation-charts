###############################################################################
# Main configuration file                                                     #
# To override single property use --set                                       #
# To override multiple, provide another values-override.yaml with the -f flag #
# See https://helm.sh/docs/chart_template_guide/values_files/                 #
###############################################################################

#########################
# Global Configurations #
#########################

global:
  # Overrides image.registry
  # Can be used to override it globally when using umbrella charts.
  imageRegistry: ""

  # Inserts additional pull secret references together along with any from .Values.image.pullSecrets
  # Can be used to override it globally when using umbrella charts.
  # Values are processed as Helm templates.
  # Ref: https://kubernetes.io/docs/concepts/configuration/secret/#using-imagepullsecrets
  #
  # Example:
  # imagePullSecrets:
  #   - name: my-pull-secret
  imagePullSecrets: []

###############################
#   Metadata Configurations   #
# Naming and labels overrides #
###############################

# Overrides the name of the chart affecting the names of the Graph Automation Chunker resources.
nameOverride: ""

# Overrides the naming of all Graph Automation Chunker resources, effectively removing the chart's name and the release name prefix.
# This override takes precedence over anything in .Values.nameOverride
fullnameOverride: ""

# Overrides the deployment namespace in case of multi-namespace deployments, for example when using umbrella charts
# where some sub-charts should be deployed in different namespaces.
# This affects every resource deployed by this chart.
# The default value is .Release.Namespace if this is left unspecified.
namespaceOverride: ""

# Additional common labels to add to all Graph Automation Chunker resources.
# Values are processed as Helm templates.
# Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
#
# Example:
# labels:
#   foo: bar
#   some-label: {{ .Values.someValue }}
labels: {}

# Additional common annotations to add to all Graph Automation Chunker resources.
# Values are processed as Helm templates.
# Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
#
# Example:
# annotations:
#   foo: bar
#   some-annotation: {{ .Values.someValue }}
annotations: {}

#################################################
# Graph Automation Chunker Image Configurations #
#################################################

# Image configurations for Graph Automation Chunker service.
# Ref: https://kubernetes.io/docs/concepts/containers/images/
image:
  # The registry that hosts the Graph Automation Chunker image.
  # The default is to pull it from the official Docker registry, but this can be overridden to pull from other public or
  # private registries.
  registry: maven.ontotext.com

  # The repository name of the Graph Automation Chunker image.
  repository: graph-automation/api-chunker

  # Image tag that corresponds to the version of Graph Automation Chunker.
  # By default, the chart uses .Chart.AppVersion to construct the full image name.
  # Use this to override the value from .Chart.AppVersion and effectively deploy a custom Graph Automation Chunker version.
  tag: ""

  # Expected SHA256 digest of the used Graph Automation Chunker image, e.g. "sha256@abc"
  # Use the digest to make sure you are always deploying the exact same Graph Automation Chunker image.
  # Defining this would override .Chart.AppVersion and image.tag
  digest: ""

  # Defines the policy for pulling images
  # Ref: https://kubernetes.io/docs/concepts/containers/images/#image-pull-policy
  pullPolicy: IfNotPresent

  # Secrets for pulling Graph Automation Chunker's image from secured registries.
  # Values are processed as Helm templates.
  # Ref: https://kubernetes.io/docs/concepts/configuration/secret/#using-imagepullsecrets
  #
  # Example:
  # pullSecrets:
  #   - name: my-pull-secret
  pullSecrets: []

##########################
# Scaling Configurations #
##########################

# Number of Graph Automation Chunker pods to be deployed as part of the Deployment resource.
replicas: 1

# Horizontal Pod Autoscaler configuration that can automatically scale the number of Graph Automation Chunker pods based on
# resource utilization.
# Ref: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

###########################################
# Graph Automation Chunker Configurations #
###########################################

# Graph Automation Chunker runtime configuration settings.
configuration:

  # The Document Chunker service supports the following modes:
  # - api
  # - store
  # - parse
  # - sectioning
  mode: api

  # Graph Automation Chunker properties to insert in the default ConfigMap.
  # This config map is injected as environment variables.
  # Values are processed as Helm templates.
  properties:
    NUM_TOPIC_PARTITIONS: 2
    NUM_PARALLEL_MESSAGES: 4
    NUM_PARALLEL_PAGES: 8

    # mode = store
    STORE_TOPIC: graph-automation.chunker.store
    STORE_GROUP: graph-automation.chunker.store-v1

    # mode = parse
    PARSE_TOPIC: graph-automation.chunker.parse
    PARSE_GROUP: graph-automation.chunker.parse-v1
    PARSER_ID: openai
    # only when parser is openai
    OPENAI_MODEL_ID: ""
    # Prefer to provide this via a Secret rather than a plaintext value here
    # OPENAI_API_KEY: ""

    # mode = sectioning
    SECTIONING_TOPIC: graph-automation.chunker.sectioning
    SECTIONING_GROUP: graph-automation.chunker.sectioning-v1

  # Reference to existing ConfigMap or Secret resources containing configuration properties that will be injected
  # as environment variables. Takes precedence over .Values.configuration.properties.
  # The values are processed as Helm templates.
  #
  # Example:
  # existingProperties:
  #   - configMapRef:
  #       name: graph-automation-chunker-custom-properties
  #
  # Ref: https://kubernetes.io/docs/concepts/configuration/configmap/#using-configmaps-as-environment-variables
  # Ref: https://kubernetes.io/docs/concepts/configuration/secret/#using-secrets-as-environment-variables
  existingProperties: []

  # Configurations for connecting and authenticating to the Kafka cluster.
  #
  # For settings beyond that, use configuration.properties.
  kafka:
    # Comma separated list of bootstrap Kafka servers
    servers: kafka:9092
    # Kafka security and authentication settings.
    security:
      # Security protocol
      # Possible values: PLAINTEXT, SSL, SASL_PLAINTEXT, SASL_SSL
      protocol: PLAINTEXT
      # SASL-based authentication settings.
      # Use when kafka.protocol is SASL_PLAINTEXT or SASL_SSL
      sasl:
        # Authentication mechanism
        # Possible values: PLAIN, SCRAM-SHA-256, SCRAM-SHA-512
        mechanism: PLAIN
        credentials:
          # Reference to a Secret containing the credentials for connecting to the Kafka cluster.
          # The value is processed as a Helm template.
          existingSecret: ""
          # The name of the Kafka user.
          # Takes precedence over usernameKey.
          username: ""
          # Name of the key in the existing Secret that contains the username.
          usernameKey: SASL_USERNAME
          # Name of the key in the existing Secret that contains the password.
          passwordKey: SASL_PASSWORD

  # Configurations for connecting the Chunker service to a PostgreSQL database.
  # Ref: https://docs.n8n.io/hosting/configuration/environment-variables/database/#postgresql
  postgresdb:
    # Hostname of the PostgreSQL database.
    # The value is processed as a Helm template.
    host: postgres
    # Port of the PostgreSQL database.
    port: 5432
    # Name of the database to connect to in PostgreSQL.
    database: chunker
    # Credentials for connecting to the PostgreSQL database.
    credentials:
      # Reference to a Secret containing the credentials for connecting to the PostgreSQL database.
      # The value is processed as a Helm template.
      existingSecret: ""
      # Name of the key in the existing Secret that contains the username.
      usernameKey: DATABASE_USER
      # Name of the key in the existing Secret that contains the password.
      passwordKey: DATABASE_PASSWORD

##########################
# Ingress Configurations #
##########################

# Configurations for the default Ingress resource for Graph Automation Chunker.
#
# The default Ingress in this chart makes no assumptions of what Ingress controller is being used, it's up to you to
# define any specific annotations required by the controller implementation in your cluster.
#
# Ref: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  # Toggles the deployment of the default Ingress resource.
  enabled: false
  # Specifies the ingress controller implementation that will control this Ingress resource.
  # Not defining this would result in using the default ingress controller in the cluster, if there is one.
  className: ""
  # Additional labels to append to the Ingress resource.
  # Values are processed as Helm templates.
  labels: {}
  # Additional annotations to append to the Ingress resource.
  # Values are processed as Helm templates.
  annotations: {}
  # Configures the hosts on which this Ingress is available.
  # Ref: https://kubernetes.io/docs/concepts/services-networking/ingress/#name-based-virtual-hosting
  #
  # Example:
  # hosts:
  #   - host: chart-example.local
  #     paths:
  #       - path: /
  #         pathType: ImplementationSpecific
  hosts: []
  # Configures SSL termination on Ingress level.
  # Ref: https://kubernetes.io/docs/concepts/services-networking/ingress/#tls
  #
  # Example:
  # tls:
  #   - secretName: chart-example-tls
  #     hosts:
  #       - chart-example.local
  tls: []

##########################
# Service Configurations #
##########################

# Configurations for Graph Automation Chunker Service.
# Important: These are valid only when configuraiton.mode = "api"
# Ref: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # Enables or disables the Service deployment
  enabled: true
  # Additional labels to append to the Service resource.
  # Values are processed as Helm templates.
  labels: {}
  # Additional annotations to append to the Service resource.
  # Values are processed as Helm templates.
  annotations: {}
  # Service type
  # Ref: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # Ports exposed by the Service.
  # Note: If you want to add additional ports, use .Values.service.extraPorts.
  ports:
    # Port mapped to Graph Automation Chunker HTTP API.
    http: 8000
  # Exposes the Service on a specific node port on the host machine when "serviceType: NodePort"
  # If left undefined, K8S will pick a random port from the node port range of the cluster.
  nodePort: ""
  # Defines the policy for treating external ingress traffic.
  # By default, Cluster does not preserve client IPs. Change to Local to preserve them.
  # See https://kubernetes.io/docs/tasks/access-application-cluster/create-external-load-balancer/#preserving-the-client-source-ip
  externalTrafficPolicy: ""
  # NodePort used by external load balancers when the external traffic policy is set to Local.
  # By default, Kubernetes will assign a random port, use this to override it.
  healthCheckNodePort: ""
  # Defines the class that should select a particular load balancer implementation.
  # By default, Kubernetes will assign the cluster default implementation, use this to override it.
  # Ref: https://kubernetes.io/docs/concepts/services-networking/service/#load-balancer-class
  loadBalancerClass: ""
  # Source IP ranges for restricting external ingress traffic
  loadBalancerSourceRanges: []
  # External IP addresses at which the Service will be exposed
  # Ref: https://kubernetes.io/docs/concepts/services-networking/service/#external-ips
  externalIPs: []
  # Additional ports to expose with the Service.
  extraPorts: []

##############################
# Persistence Configurations #
##############################

# Configurations for the Document Chunker filesystem persistence.
#
# Note: The chart uses an emptyDir ephemeral volume for filesystem storage of any temporary data the service might need.
# For storing persistent data, the chunker uses PostgreSQL.
persistence:
  # Toggles the ephemeral persistent volume mounting.
  enabled: true
  # Storage location inside the container where the ephemeral volume will be mounted at.
  # The value is processed as a Helm template.
  mountPath: /app/data/
  # Configurations for an emptyDir volume to be used for data storage.
  # Ref: https://kubernetes.io/docs/concepts/storage/ephemeral-volumes/
  emptyDir:
    # Default emptyDir limit, override to your needs.
    sizeLimit: 1Gi

# The Document Chunker services shares data via an NFS-backed PersistentVolume.
# Providing a value for uploadsVolume.existingVolumeClaim.claimName enables this volume mount.
uploadsVolume:
  # Storage location inside the container where the PersistenceClaimVolume will be mounted at.
  # The value is processed as a Helm template.
  mountPath: /app/uploads
  # Existing PeristentVolumeClaim to use for the shared uploads volume.
  # Note that this PVC should support ReadOnlyMany or ReadWriteMany access mode if you have a multi-node Kubernetes cluster.
  # Ref: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
  existingVolumeClaim:
    # The name of the existing PeristentVolumeClaim to use.
    claimName: ""
    # Name of the import volume declaration.
    volumeName: import-volume

# Configurations for an emptyDir volume for the /tmp folder in each Graph Automation Chunker container.
# Because the default security context in .Values.securityContext configures the root filesystem to be in read-only mode, certain features
# cannot create and write files in /tmp. If you don't use a read-only root filesystem, you can disable this with .Values.tempVolume.enabled
tempVolume:
  # Toggles the temp folder emptyDir volume creation.
  # - If enabled, the StatefulSet will use an emptyDir volume for /tmp.
  # - If disabled, the chart won't create and mount ephemeral volumes for /tmp.
  enabled: true
  # Default location of the temp directory inside the container where the temp volume will be mounted.
  mountPath: /tmp
  # Configurations for an emptyDir volume to be used for /tmp.
  # Ref: https://kubernetes.io/docs/concepts/storage/ephemeral-volumes/
  emptyDir:
    # Default emptyDir limit, override to your needs.
    sizeLimit: 1Gi

#############################
# Deployment Configurations #
#############################

# Configures the strategy of updating Deployment Pods.
# Ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#updating-a-deployment
updateStrategy:
  type: RollingUpdate

# Changes the maximum number of revisions that are kept.
revisionHistoryLimit: 10

# Grace period in seconds before terminating the Pods.
# Ref: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#pod-termination
terminationGracePeriodSeconds: 60

# Toggles the auto mounting of API credentials token into the Pods.
# Enable this if you need to contact either the API server or need web identity credentials for federated authentication in cloud APIs.
# Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/#opt-out-of-api-credential-automounting
automountServiceAccountToken: false

# Overrides the default Kubernetes scheduler.
# See https://kubernetes.io/docs/tasks/extend-kubernetes/configure-multiple-schedulers/#specify-schedulers-for-pods
schedulerName: ""

# Overrides the Pod's DNS settings.
# Ref: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/#pod-dns-config
dnsConfig: {}

# Defines the Pod's policy for DNS resolution.
# Ref: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/#pod-s-dns-policy
dnsPolicy: ""

# Name of an existing PriorityClass to assign, defining the importance of the pods compared to other pods in the cluster.
# Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/
priorityClassName: ""

# Overrides the default Graph Automation Chunker container command.
# Use only for troubleshooting!
# See https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/
command: []

# Overrides the default Graph Automation Chunker container command's arguments.
# Use only for troubleshooting!
# See https://kubernetes.io/docs/tasks/inject-data-application/define-command-argument-container/
args: []

# Ports used by the Graph Automation Chunker container
# Note: If you want to add additional ports, use .Values.extraContainerPorts.
# Important: These are valid only when configuraiton.mode = "api"
containerPorts:
  # Port mapped to Graph Automation Chunker HTTP API.
  http: 8000

# Additional labels to append to the Pod definition.
# Values are processed as Helm templates.
# Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# Additional annotations to append to the Pod definition.
# Values are processed as Helm templates.
# Ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}

###################################
# Security Context Configurations #
###################################

# Defines privilege and access control settings for all containers in the Graph Automation Chunker Pod.
# See https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# Defines privilege and access control settings for the container running Graph Automation Chunker.
# See https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

#############################
# Scheduling Configurations #
#############################

# Selector labels to match when selecting nodes.
# Values are processed as Helm templates.
# Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
# See https://kubernetes.io/docs/tasks/configure-pod-container/assign-pods-nodes/
nodeSelector: {}

# Node and pod affinity & anti affinity configurations for constraining the Pod scheduling.
# Values are processed as Helm templates.
# Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
affinity: {}

# Default podAntiAffinity rule ensuring that Graph Automation Chunker pods are scheduled on different Kubernetes nodes.
#
# Possible values for .Values.podAntiAffinity.preset are:
# - "soft" (default) - Configures a preferredDuringSchedulingIgnoredDuringExecution rule.
# - "hard" - Configures a requiredDuringSchedulingIgnoredDuringExecution rule.
# Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
podAntiAffinity:
  enabled: true
  preset: soft
  topology: kubernetes.io/hostname

# List of taint tolerations.
# Values are processed as Helm templates.
# Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
tolerations: []

# Configurations for spreading Pods across different failure domains.
# Values are processed as Helm templates.
# Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#pod-topology-spread-constraints
# Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
topologySpreadConstraints: []

##########################
# Resource Configuration #
##########################

# Resource configurations for the Graph Automation Chunker containers.
# Ref: https://kubernetes.io/docs/tasks/configure-pod-container/assign-pods-nodes/
resources:
  limits:
    memory: 512Mi
  requests:
    memory: 512Mi
    cpu: 100m

#########################
# Probes Configurations #
#########################

# Kubernetes probes configurations.
# Important: These are valid only when configuraiton.mode = "api"
# Ref: https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/

# Configurations for the Graph Automation Chunker container startup probe.
startupProbe:
  httpGet:
    path: /health
    port: http
  failureThreshold: 300
  timeoutSeconds: 1
  periodSeconds: 3

# Configurations for the Graph Automation Chunker container readiness probe.
readinessProbe:
  httpGet:
    path: /health
    port: http
  timeoutSeconds: 5
  periodSeconds: 10

# Configurations for the Graph Automation Chunker container liveness probe.
livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 60
  timeoutSeconds: 5
  periodSeconds: 10

########################################
# Additional Deployment Configurations #
########################################

# Additional environment variables to be set for the Graph Automation Chunker containers.
# Values are processed as Helm templates.
extraEnvFrom: []

# Additional environment variables to be set for the Graph Automation Chunker containers.
# Values are processed as Helm templates.
extraEnv: []

# Additional volumes to be set for the Graph Automation Chunker Pod.
# Values are processed as Helm templates.
extraVolumes: []

# Additional volume mounts to be set for the Graph Automation Chunker containers.
# Values are processed as Helm templates.
extraVolumeMounts: []

# Additional init containers to be inserted after the provisioning init containers.
# Values are processed as Helm templates.
extraInitContainers: []

# Additional Graph Automation Chunker container ports to expose.
extraContainerPorts: {}

# Additional containers to insert into the Graph Automation Chunker Pod, e.g. sidecar containers
# Values are processed as Helm templates.
extraContainers: []

########################################
# Pod Disruption Budget Configurations #
########################################

# Configurations for Graph Automation Chunker default Pod Disruption Budget.
# Ref: https://kubernetes.io/docs/concepts/workloads/pods/disruptions/#pod-disruption-budgets
podDisruptionBudget:
  enabled: false
  minAvailable: 51%
  maxUnavailable: ""

##################################
# Service Account Configurations #
##################################

# Configurations for the default ServiceAccount for Graph Automation Chunker.
# Ref: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a ServiceAccount should be created for Graph Automation Chunker.
  create: false

  # The name of the ServiceAccount to use.
  #
  # There are three cases to be aware of when using this:
  # - If not set and create is true, a name is generated using the fullname template
  # - If set and create is true, it will use the provided name when creating the ServiceAccount
  # - If set but create is false, it will use the provided ServiceAccount.
  name: ""

  # If .Values.serviceAccount.create is true, insert additional annotations to the created ServiceAccount.
  # Values are processed as Helm templates.
  annotations: {}

#################################
# Additional Kubernetes Objects #
#################################

# Additional objects to insert along with the release.
# Values are processed as Helm templates with tpl function.
# Ref: https://helm.sh/docs/howto/charts_tips_and_tricks/#using-the-tpl-function
extraObjects: []
