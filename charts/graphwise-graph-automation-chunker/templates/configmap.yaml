apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "graphwise-graph-automation-chunker.fullname" . }}
  namespace: {{ include "graphwise-graph-automation-chunker.namespace" . }}
  labels:
    {{- include "graphwise-graph-automation-chunker.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
data:
  {{- if not (hasKey .Values.configuration.properties "DATABASE_HOST") }}
  DATABASE_HOST: {{ .Values.configuration.postgresdb.host }}
  {{- end }}
  {{- if not (hasKey .Values.configuration.properties "DATABASE_PORT") }}
  DATABASE_PORT: {{ .Values.configuration.postgresdb.port | toString | quote }}
  {{- end }}
  {{- if not (hasKey .Values.configuration.properties "DATABASE_NAME") }}
  DATABASE_NAME: {{ .Values.configuration.postgresdb.database }}
  {{- end }}
  {{- if not (hasKey .Values.configuration.properties "PROMPT_DIR") }}
  PROMPT_DIR: {{ tpl .Values.persistence.mountPath . }}/prompts/
  {{- end }}
  {{- if not (hasKey .Values.configuration.properties "UPLOAD_DIR") }}
  UPLOAD_DIR: {{ tpl .Values.uploadsVolume.mountPath . }}
  {{- end }}
  {{- if not (hasKey .Values.configuration.properties "KAFKA_BOOTSTRAP_SERVERS") }}
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.configuration.kafka.servers }}
  {{- end }}
  {{- if not (hasKey .Values.configuration.properties "SASL_SECURITY_PROTOCOL") }}
  SASL_SECURITY_PROTOCOL: {{ .Values.configuration.kafka.security.protocol }}
  {{- end }}
  {{- if hasPrefix "SASL" .Values.configuration.kafka.security.protocol }}
    {{- if not (hasKey .Values.configuration.properties "SASL_MECHANISM") }}
  SASL_MECHANISM: {{ .Values.configuration.kafka.security.sasl.mechanism }}
    {{- end }}
  {{- end }}
  {{- if .Values.configuration.properties -}}
    {{- range $key, $value := .Values.configuration.properties -}}
      {{- if ne $value nil -}}
        {{- printf "%s: %s" $key (tpl ($value | toString) $ | quote) | nindent 2 -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
