apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "graphwise-graph-automation-chunker.fullname" . }}
  namespace: {{ include "graphwise-graph-automation-chunker.namespace" . }}
  labels:
    {{- include "graphwise-graph-automation-chunker.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicas }}
  strategy: {{ .Values.updateStrategy | toYaml | nindent 4 }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "graphwise-graph-automation-chunker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "graphwise-graph-automation-chunker.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
          {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
      annotations:
        checksum/configmap: {{ include (print .Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
          {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "graphwise-graph-automation-chunker.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- if .Values.schedulerName }}
      schedulerName: {{ .Values.schedulerName }}
      {{- end }}
      {{- with .Values.dnsConfig }}
      dnsConfig: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.dnsPolicy }}
      dnsPolicy: {{ .Values.dnsPolicy }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: storage
          emptyDir: {{ .Values.persistence.emptyDir | toYaml | nindent 12 }}
        {{- end }}
        {{- if .Values.uploadsVolume.existingVolumeClaim.claimName }}
        - name: {{ .Values.uploadsVolume.existingVolumeClaim.volumeName }}
          persistentVolumeClaim:
            claimName: {{ .Values.uploadsVolume.existingVolumeClaim.claimName }}
        {{- end }}
        {{- if .Values.tempVolume.enabled }}
        - name: temp
          emptyDir: {{ .Values.tempVolume.emptyDir | toYaml | nindent 12 }}
        {{- end }}
        {{- with .Values.extraVolumes }}
          {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      {{- if or .Values.affinity .Values.podAntiAffinity.enabled }}
      affinity:
        {{- if .Values.affinity  }}
          {{- tpl (toYaml .Values.affinity) $ | nindent 8 }}
        {{- end }}
        {{- if and .Values.podAntiAffinity.enabled (not .Values.affinity.podAntiAffinity) }}
        podAntiAffinity:
          {{- if eq .Values.podAntiAffinity.preset "soft" }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              podAffinityTerm:
                topologyKey: {{ .Values.podAntiAffinity.topology }}
                labelSelector:
                  matchLabels:
                    {{- include "graphwise-graph-automation-chunker.selectorLabels" . | nindent 20 }}
          {{- else if eq .Values.podAntiAffinity.preset "hard" }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: {{ .Values.podAntiAffinity.topology }}
              labelSelector:
                matchLabels:
                  {{- include "graphwise-graph-automation-chunker.selectorLabels" . | nindent 18 }}
          {{- else }}
            {{- fail (printf "Unknown podAntiAffinity preset '%s'" .Values.podAntiAffinity.preset) }}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.global.imagePullSecrets .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- include "graphwise-graph-automation-chunker.combinedImagePullSecrets" . | nindent 8 }}
      {{- end }}
      {{- with .Values.extraInitContainers }}
      initContainers:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "graphwise-graph-automation-chunker.name" . }}
          image: {{ include "graphwise-graph-automation-chunker.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.command }}
          command: {{ toYaml .Values.command | nindent 12 }}
          {{- else if eq .Values.configuration.mode "api" }}
          command: [ "/app/entrypoint.sh" ]
          {{- end }}
          {{- if .Values.args }}
          args: {{ toYaml .Values.args  | nindent 12 }}
          {{- else if eq .Values.configuration.mode "store" }}
          args: [ "python", "-m", "app.tasks.store_task" ]
          {{- else if eq .Values.configuration.mode "parse" }}
          args: [ "python", "-m", "app.tasks.parse_task" ]
          {{- else if eq .Values.configuration.mode "sectioning" }}
          args: [ "python", "-m", "app.tasks.sectioning_task" ]
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPorts.http }}
            {{- with .Values.extraContainerPorts }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "graphwise-graph-automation-chunker.fullname" . }}
            {{- with .Values.configuration.existingProperties }}
              {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
            {{- with .Values.extraEnvFrom }}
              {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
          env:
            {{- if .Values.configuration.kafka.security.sasl.credentials.existingSecret }}
            - name: SASL_USERNAME
              {{- if .Values.configuration.kafka.security.sasl.credentials.username }}
              value: {{ .Values.configuration.kafka.security.sasl.credentials.username }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .Values.configuration.kafka.security.sasl.credentials.existingSecret . }}
                  key: {{ .Values.configuration.kafka.security.sasl.credentials.usernameKey }}
              {{- end }}
            - name: SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .Values.configuration.kafka.security.sasl.credentials.existingSecret . }}
                  key: {{ .Values.configuration.kafka.security.sasl.credentials.passwordKey }}
            {{- end }}
            {{- if .Values.configuration.postgresdb.credentials.existingSecret }}
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .Values.configuration.postgresdb.credentials.existingSecret $ }}
                  key: {{ .Values.configuration.postgresdb.credentials.usernameKey }}
            {{- end }}
            {{- if .Values.configuration.postgresdb.credentials.existingSecret }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .Values.configuration.postgresdb.credentials.existingSecret $ }}
                  key: {{ .Values.configuration.postgresdb.credentials.passwordKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
              {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: storage
              mountPath: {{ tpl .Values.persistence.mountPath . }}
            {{- end }}
            {{- if .Values.uploadsVolume.existingVolumeClaim.claimName }}
            - name: {{ .Values.uploadsVolume.existingVolumeClaim.volumeName }}
              mountPath: {{ tpl .Values.uploadsVolume.mountPath . }}
            {{- end }}
            {{- if .Values.tempVolume.enabled }}
            - name: temp
              mountPath: {{ .Values.tempVolume.mountPath }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
              {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
          {{- with .Values.resources }}
          resources: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe: {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- with .Values.extraContainers }}
          {{ tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
